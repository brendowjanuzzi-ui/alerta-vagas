<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Alerta Vaga - Próximo de Você</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyB2frG9-iSSGQKeAsDUpyxUCSBdI0CCLp0&libraries=geometry"></script>

  <style>
    :root { --primary: #0a66c2; --bg: #f3f2ef; --dark: #000000; --card: #ffffff; --border: #e0e0e0; --text-sec: #666666; }
    * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { margin: 0; background: var(--bg); color: var(--dark); overflow: hidden; }

    header { background: #ffffff; padding: 10px 24px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; z-index: 100; position: relative; }
    .logo { color: var(--primary); font-weight: 800; font-size: 1.4rem; }
    
    #main-container { display: flex; height: calc(100vh - 61px); }
    #sidebar { width: 400px; background: var(--bg); padding: 15px; overflow-y: auto; border-right: 1px solid var(--border); }
    #map { flex: 1; position: relative; }

    /* CARD DE PERFIL ESTILO LINKEDIN */
    .linkedin-card { background: white; border-radius: 10px; overflow: hidden; border: 1px solid var(--border); margin-bottom: 15px; }
    .card-banner { height: 60px; background: linear-gradient(to right, #a0b4b7, #dbe7e9); }
    .card-content { padding: 0 15px 15px 15px; text-align: center; margin-top: -35px; }
    .card-avatar { width: 72px; height: 72px; border-radius: 50%; border: 4px solid white; object-fit: cover; background: #eee; }
    .card-name { margin: 8px 0 2px 0; font-size: 1rem; font-weight: 700; }
    
    /* TITULO DINAMICO SOLICITADO */
    .section-title { font-size: 1.1rem; font-weight: 800; color: var(--dark); margin: 20px 0 10px 0; display: flex; align-items: center; gap: 8px; }
    .pulse-icon { width: 10px; height: 10px; background: #ef4444; border-radius: 50%; box-shadow: 0 0 0 rgba(239, 68, 68, 0.4); animation: pulse 2s infinite; }
    
    @keyframes pulse { 0% { box-shadow: 0 0 0 0px rgba(239, 68, 68, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0px rgba(239, 68, 68, 0); } }

    .job-card { background: white; border-radius: 8px; padding: 15px; margin-bottom: 12px; border: 1px solid var(--border); }
    .job-title { font-weight: 700; color: var(--primary); font-size: 1rem; }
    .contact-options { display: flex; gap: 8px; margin-top: 10px; }
    .btn-contact { flex: 1; padding: 8px; border-radius: 20px; border: 1px solid var(--primary); background: transparent; color: var(--primary); font-weight: 700; font-size: 0.75rem; cursor: pointer; }
    .btn-primary { background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 20px; font-weight: 700; cursor: pointer; }

    .hidden { display: none !important; }
    input { width: 100%; padding: 10px; border-radius: 5px; border: 1px solid var(--border); margin-bottom: 10px; }
  </style>
</head>
<body>

<header>
    <div class="logo">in Alerta Vaga</div>
    <div id="auth-buttons">
        <button class="btn-primary" id="btn-login" onclick="window.mostrarLogin()">Entrar</button>
        <button class="btn-contact" id="btn-sair" onclick="window.sair()" style="display:none">Sair</button>
    </div>
</header>

<div id="main-container">
  <div id="sidebar">
    
    <div id="user-profile" class="linkedin-card hidden">
        <div class="card-banner"></div>
        <div class="card-content">
            <img id="u-photo" class="card-avatar" src="">
            <div class="card-name" id="u-name"></div>
            <input id="u-headline" placeholder="Seu cargo..." style="text-align:center; border:none; font-size:0.8rem;">
            <button class="btn-contact" style="width:100%" onclick="window.salvarPerfil()">Salvar Perfil</button>
        </div>
    </div>

    <div class="section-box">
        <label style="font-size: 0.8rem; font-weight: 700;">Raio de alcance: <span id="km-val">5</span> km</label>
        <input type="range" id="range-km" min="1" max="50" value="5" oninput="window.atualizarBusca()">
    </div>

    <div class="section-title">
        <div class="pulse-icon"></div>
        Alerta vagas próximas de você
    </div>

    <div id="company-panel" class="linkedin-card hidden" style="padding:15px; border-top: 4px solid var(--primary);">
        <h4 style="margin:0 0 10px 0">Postar Vaga 📍</h4>
        <input type="text" id="v-emp" placeholder="Empresa">
        <input type="text" id="v-cargo" placeholder="Cargo">
        <input type="text" id="v-wa" placeholder="WhatsApp">
        <input type="text" id="v-email" placeholder="E-mail">
    </div>

    <div id="jobs-list"></div>
  </div>

  <div id="map"></div>
</div>

<div id="login-modal" style="position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:1000; display:none; align-items:center; justify-content:center;">
    <div style="background:white; padding:30px; border-radius:12px; text-align:center; width:320px;">
        <h3>Como deseja entrar?</h3>
        <button onclick="window.defPapel('candidato')" style="width:100%; margin-bottom:10px; padding:10px;">👤 Candidato</button>
        <button onclick="window.defPapel('empresa')" style="width:100%; margin-bottom:10px; padding:10px;">🏢 Empresa</button>
        <button class="btn-primary" id="g-login" style="width:100%" onclick="window.fazerLogin()" disabled>Login com Google</button>
    </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getFirestore, collection, addDoc, onSnapshot, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
  import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDqc9r2B1IDMyRb0hPZBWD3F43GlKZPzRQ",
    authDomain: "alertavaga-56b46.firebaseapp.com",
    projectId: "alertavaga-56b46",
    storageBucket: "alertavaga-56b46.firebasestorage.app",
    messagingSenderId: "1006667244458",
    appId: "1:1006667244458:web:4c2f35f5520843452c01d3"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);
  const provider = new GoogleAuthProvider();

  let map, circle, allVagas = [], markers = [], papelT = null;
  let userPos = { lat: -19.919, lng: -43.938 };

  window.mostrarLogin = () => document.getElementById('login-modal').style.display='flex';
  window.defPapel = (p) => { papelT = p; document.getElementById('g-login').disabled = false; };
  window.fazerLogin = () => signInWithPopup(auth, provider).then(() => document.getElementById('login-modal').style.display='none');
  window.sair = () => signOut(auth).then(() => location.reload());

  onAuthStateChanged(auth, async (user) => {
    if (user) {
        document.getElementById('btn-login').style.display = 'none';
        document.getElementById('btn-sair').style.display = 'block';
        document.getElementById('user-profile').classList.remove('hidden');
        const d = await getDoc(doc(db, "usuarios", user.uid));
        let pf = d.exists() ? d.data().tipo : papelT;
        if (!d.exists() && pf) await setDoc(doc(db, "usuarios", user.uid), { tipo: pf, bio: "" });
        document.getElementById('u-name').innerText = user.displayName;
        document.getElementById('u-photo').src = user.photoURL;
        document.getElementById('u-headline').value = d.data()?.bio || "";
        if (pf === 'empresa') document.getElementById('company-panel').classList.remove('hidden');
        window.meuP = pf;
    }
    initMap();
  });

  function initMap() {
    if (map) return;
    map = new google.maps.Map(document.getElementById('map'), { center: userPos, zoom: 14, disableDefaultUI: true });
    circle = new google.maps.Circle({ map, center: userPos, radius: 5000, fillColor: "#0a66c2", fillOpacity: 0.1, strokeOpacity: 0, clickable: false });
    
    map.addListener('click', async (e) => {
        if (window.meuP !== 'empresa') return;
        const emp = document.getElementById('v-emp').value;
        const car = document.getElementById('v-cargo').value;
        if (!emp || !car) return alert("Preencha os dados!");
        await addDoc(collection(db, "vagas"), { emp, cargo: car, wa: document.getElementById('v-wa').value, mail: document.getElementById('v-email').value, lat: e.latLng.lat(), lng: e.latLng.lng() });
    });

    onSnapshot(collection(db, "vagas"), (snap) => {
        allVagas = []; snap.forEach(d => allVagas.push(d.data()));
        window.atualizarBusca();
    });
  }

  window.atualizarBusca = () => {
    const km = document.getElementById('range-km').value;
    document.getElementById('km-val').innerText = km;
    circle.setRadius(km * 1000);
    const filter = allVagas.filter(v => google.maps.geometry.spherical.computeDistanceBetween(new google.maps.LatLng(userPos.lat, userPos.lng), new google.maps.LatLng(v.lat, v.lng)) <= (km * 1000));
    render(filter);
  };

  function render(vagas) {
    const list = document.getElementById('jobs-list');
    list.innerHTML = ""; markers.forEach(m => m.setMap(null));
    vagas.forEach(v => {
        const card = document.createElement('div');
        card.className = "job-card";
        card.innerHTML = `<div class="job-title">${v.cargo}</div><div>${v.emp}</div>
            <div class="contact-options">
                ${v.wa ? `<button class="btn-contact" onclick="window.open('https://wa.me/${v.wa.replace(/\D/g,'')}')">WhatsApp</button>` : ''}
                ${v.mail ? `<button class="btn-contact" onclick="window.location.href='mailto:${v.mail}'">E-mail</button>` : ''}
            </div>`;
        list.appendChild(card);
        markers.push(new google.maps.Marker({ position: {lat: v.lat, lng: v.lng}, map }));
    });
  }

  window.initMap = initMap;
</script>
</body>
</html>
