<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alerta Vagas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background-color: #f9f9f9; }
    header { background: #007bff; color: white; padding: 1rem; text-align: center; }
    #map { height: 500px; border-radius: 10px; }
    #listaVagas, #listaFavoritos { max-height: 500px; overflow-y: auto; }
    .vaga-item { cursor: pointer; padding: 10px; border-bottom: 1px solid #ddd; }
    .vaga-item:hover { background-color: #f1f1f1; }
    .favorito-btn { float: right; margin-left: 5px; }
    footer { background: #f1f1f1; text-align: center; padding: 1rem; margin-top: 2rem; }
  </style>
</head>
<body>
  <header>
    <h1>🚀 Alerta Vagas Próximas de Você</h1>
    <p>Encontre oportunidades de trabalho perto da sua localização</p>
    <button id="loginGoogle" class="btn btn-light">Login com Google</button>
    <button id="logout" class="btn btn-danger" style="display:none;">Sair</button>
  </header>

  <main class="container mt-4">
    <div class="row">
      <!-- Lista lateral -->
      <div class="col-md-4">
        <h3>Lista de Vagas</h3>
        <input type="text" id="busca" class="form-control mb-3" placeholder="Buscar por cargo ou empresa...">
        <div id="listaVagas" class="list-group"></div>

        <h3 class="mt-4">Favoritos</h3>
        <div id="listaFavoritos" class="list-group"></div>
      </div>

      <!-- Mapa -->
      <div class="col-md-8">
        <h3>Mapa de Vagas</h3>
        <div id="map"></div>
      </div>
    </div>
  </main>

  <footer>
    <p>© 2026 Alerta Vagas - Desenvolvido por Brendow Januzzi</p>
  </footer>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-firestore.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth.js"></script>

  <!-- Leaflet -->
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

  <script>
    // Configuração do Firebase com seus dados
    const firebaseConfig = {
      apiKey: "AIzaSyDqc9r2B1IDMyRb0hPZBWD3F43GlKZPzRQ",
      authDomain: "alertavaga-56b46.firebaseapp.com",
      projectId: "alertavaga-56b46",
      storageBucket: "alertavaga-56b46.firebasestorage.app",
      messagingSenderId: "1006667244458",
      appId: "1:1006667244458:web:4c2f35f5520843452c01d3"
    };

    const app = firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    var map = L.map('map').setView([-19.9167, -43.9345], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    var markersGroup = L.layerGroup().addTo(map);
    var markers = {};
    var vagasCache = [];
    var userId = null;

    // Login/Logout
    document.getElementById("loginGoogle").addEventListener("click", () => {
      const provider = new firebase.auth.GoogleAuthProvider();
      auth.signInWithPopup(provider);
    });

    document.getElementById("logout").addEventListener("click", () => {
      auth.signOut();
    });

    auth.onAuthStateChanged((user) => {
      if (user) {
        userId = user.uid;
        document.getElementById("loginGoogle").style.display = "none";
        document.getElementById("logout").style.display = "inline-block";
        carregarFavoritos();
      } else {
        userId = null;
        document.getElementById("loginGoogle").style.display = "inline-block";
        document.getElementById("logout").style.display = "none";
        document.getElementById("listaFavoritos").innerHTML = "";
      }
    });

    // Permissão para notificações
    if ("Notification" in window) {
      Notification.requestPermission();
    }

    // Vagas em tempo real
    db.collection("vagas").onSnapshot((snapshot) => {
      const novasVagas = [];
      vagasCache = snapshot.docs.map(doc => doc.data());

      snapshot.docChanges().forEach(change => {
        if (change.type === "added") {
          novasVagas.push(change.doc.data());
        }
      });

      atualizarMapaLista();

      // Notificação em tempo real
      novasVagas.forEach(vaga => {
        if (Notification.permission === "granted") {
          new Notification("Nova vaga disponível!", {
            body: `${vaga.titulo} - R$ ${vaga.salario}`,
          });
        } else {
          alert(`Nova vaga: ${vaga.titulo} - R$ ${vaga.salario}`);
        }
      });
    });

    function atualizarMapaLista() {
      markersGroup.clearLayers();
      document.getElementById("listaVagas").innerHTML = "";

      const termoBusca = document.getElementById("busca").value.toLowerCase();

      vagasCache.forEach((vaga) => {
        if (!vaga.lat || !vaga.lng) return;

        const texto = (vaga.titulo + " " + vaga.descricao).toLowerCase();
        if (termoBusca && !texto.includes(termoBusca)) return;

        const marker = L.marker([vaga.lat, vaga.lng]).addTo(markersGroup)
          .bindPopup(`<b>${vaga.titulo}</b><br>${vaga.descricao}<br>Salário: R$ ${vaga.salario}`);
        markers[vaga.titulo] = marker;

        const item = document.createElement("div");
        item.className = "vaga-item list-group-item";
        item.innerHTML = `<b>${vaga.titulo}</b><br>${vaga.descricao}<br>Salário: R$ ${vaga.salario}`;

        const favBtn = document.createElement("button");
        favBtn.className = "btn btn-sm btn-outline-primary favorito-btn";
        favBtn.innerText = "⭐";
        favBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          adicionarFavorito(vaga);
        });
        item.appendChild(favBtn);

        item.addEventListener("click", () => {
          map.setView([vaga.lat, vaga.lng], 15);
          marker.openPopup();
        });
        document.getElementById("listaVagas").appendChild(item);
      });
    }

    document.getElementById("busca").addEventListener("input", atualizarMapaLista);

    async function adicionarFavorito(vaga) {
      if (!userId) {
        alert("Faça login para salvar favoritos!");
        return;
      }
      await db.collection("usuarios").doc(userId).collection("favoritos").doc(vaga.titulo).set(vaga);
      carregarFavoritos();
    }

    async function removerFavorito(titulo) {
      if (!userId) return;
      await db.collection("usuarios").doc(userId).collection("favoritos").doc(titulo).delete();
      carregarFavoritos();
    }

    function carregarFavoritos() {
      if (!userId) return;
      db.collection("usuarios").doc(userId).collection("favoritos").onSnapshot((snapshot) => {
        document.getElementById("listaFavoritos").innerHTML = "";
        snapshot.forEach((doc) => {
          const vaga = doc.data();
          const item = document.createElement("div");
          item.className = "vaga-item list-group-item";
          item.innerHTML = `<b>${vaga.titulo}</b><br>${vaga.descricao}<br>Salário: R$ ${vaga.salario}`;

          const removeBtn = document.createElement("button");
          removeBtn.className = "btn btn-sm btn-outline-danger favorito
