<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Alerta Vagas Próximas de Você</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyB2frG9-iSSGQKeAsDUpyxUCSBdI0CCLp0&libraries=geometry"></script>

  <style>
    :root { --primary: #0a66c2; --bg: #f3f2ef; --dark: #000000; --card: #ffffff; --border: #e0e0e0; --text-sec: #666666; --accent: #057642; }
    * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
    
    /* Ajuste para ocupar a tela inteira sem scroll no body */
    html, body { height: 100%; margin: 0; background: var(--bg); color: var(--dark); overflow: hidden; }

    header { background: #ffffff; padding: 0 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; z-index: 1000; position: relative; height: 60px; }
    .logo-title { color: var(--primary); font-weight: 800; font-size: 1rem; display: flex; align-items: center; gap: 8px; }
    .pulse-icon { width: 10px; height: 10px; background: #ef4444; border-radius: 50%; animation: pulse 2s infinite; }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0px rgba(239, 68, 68, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0px rgba(239, 68, 68, 0); } }

    #main-container { display: flex; height: calc(100vh - 60px); width: 100%; position: relative; }
    
    /* Sidebar responsiva: No PC 400px, no Celular vira um painel flutuante ou menor */
    #sidebar { width: 400px; background: var(--bg); padding: 15px; overflow-y: auto; border-right: 1px solid var(--border); z-index: 10; height: 100%; }
    
    /* MAPA: Garante que ele preencha o espaço */
    #map { flex: 1; height: 100%; position: relative; background: #e5e3df; }

    /* Ajustes para Celular */
    @media (max-width: 768px) {
        #main-container { flex-direction: column-reverse; } /* Mapa em cima, lista embaixo ou flutuando */
        #sidebar { width: 100%; height: 40%; border-right: none; border-top: 1px solid var(--border); }
        #map { height: 60%; width: 100%; }
    }

    .profile-card { background: white; border-radius: 10px; overflow: hidden; border: 1px solid var(--border); margin-bottom: 15px; text-align: center; padding-bottom: 15px; }
    .profile-banner { height: 50px; background: var(--primary); }
    .profile-photo { width: 60px; height: 60px; border-radius: 50%; border: 4px solid white; margin-top: -30px; background: #eee; object-fit: cover; }
    
    input { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid var(--border); outline: none; margin-bottom: 8px; font-size: 0.9rem; }
    
    .btn-main { background: var(--primary); color: white; border: none; padding: 12px; border-radius: 25px; font-weight: 700; width: 100%; cursor: pointer; margin-top: 5px; }
    .btn-sec { background: transparent; color: var(--primary); border: 1px solid var(--primary); padding: 8px; border-radius: 20px; font-weight: 700; width: 100%; cursor: pointer; font-size: 0.8rem; margin-top: 5px; }
    
    .btn-google { background: white; color: #444; border: 1px solid #ddd; display: flex; align-items: center; justify-content: center; gap: 10px; }
    .btn-apple { background: #000; color: white; border: none; display: flex; align-items: center; justify-content: center; gap: 10px; }
    .btn-phone { background: #25d366; color: white; border: none; display: flex; align-items: center; justify-content: center; gap: 10px; }

    .badge { font-size: 0.65rem; font-weight: 800; padding: 2px 10px; border-radius: 10px; text-transform: uppercase; color: white; }
    .hidden { display: none !important; }

    #login-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 2000; display: none; align-items: center; justify-content: center; padding: 20px; }
    .modal-box { background: white; padding: 25px; border-radius: 15px; width: 100%; max-width: 380px; text-align: center; max-height: 90vh; overflow-y: auto; }
  </style>
</head>
<body>

<div id="recaptcha-container"></div>

<header>
    <div class="logo-title"><div class="pulse-icon"></div> Alerta Vagas</div>
    <div>
        <button id="btn-entrar" class="btn-main" style="padding: 6px 15px; width: auto; font-size: 0.8rem;" onclick="window.mostrarLogin()">Entrar</button>
        <button id="btn-sair" class="btn-sec" style="display:none; width: auto;" onclick="window.logout()">Sair</button>
    </div>
</header>

<div id="main-container">
    <div id="sidebar">
        <div id="user-info" class="profile-card hidden">
            <div class="profile-banner"></div>
            <img id="u-photo" class="profile-photo" src="">
            <div id="u-name" style="font-weight: 700; margin-top: 5px;"></div>
            <div id="u-badge-container" style="margin: 5px 0;"></div>
            <div id="area-cargo-candidato" class="hidden" style="padding: 0 15px;">
                <input type="text" id="u-cargo-input" placeholder="Cargo que procura?" style="text-align: center;" onblur="window.salvarCargoPretendido()">
            </div>
            <button class="btn-sec" style="border:none; color: #666; text-decoration: underline; font-size: 0.7rem;" onclick="window.trocarPerfil()">Trocar Perfil</button>
        </div>

        <div id="panel-empresa" class="hidden" style="background:white; padding:15px; border-radius:10px; border:1px solid var(--border); border-left: 5px solid var(--accent); margin-bottom: 15px;">
            <h4 style="margin: 0 0 10px 0; color: var(--accent);">Postar Vaga 📍</h4>
            <input type="text" id="v-emp" placeholder="Empresa">
            <input type="text" id="v-cargo" placeholder="Cargo">
            <input type="text" id="v-wa" placeholder="WhatsApp">
            <p style="background: #e7f3ed; color: #057642; padding: 8px; border-radius: 6px; font-size: 0.7rem; font-weight: 700;">Toque no mapa para salvar.</p>
        </div>

        <div id="panel-candidato" style="background:white; padding:15px; border-radius:10px; border:1px solid var(--border);">
            <label style="font-size: 0.8rem; font-weight: 700;">Raio: <span id="km-val" style="color:var(--primary)">5</span> km</label>
            <input type="range" id="range-km" min="1" max="50" value="5" oninput="window.atualizar()">
        </div>

        <div id="jobs-list" style="margin-top:15px;"></div>
    </div>
    
    <div id="map"></div>
</div>

<div id="login-modal">
    <div class="modal-box">
        <h3>Acesse sua Conta</h3>
        <div style="display:flex; gap:10px; margin-bottom:20px;">
            <button id="sel-c" class="btn-sec" onclick="window.prepararPapel('candidato')">Candidato</button>
            <button id="sel-e" class="btn-sec" onclick="window.prepararPapel('empresa')">Empresa</button>
        </div>
        
        <div id="auth-fields" style="opacity:0.3; pointer-events:none;">
            <input type="email" id="auth-email" placeholder="E-mail">
            <input type="password" id="auth-pass" placeholder="Senha">
            <button class="btn-main" onclick="window.authEmail()">Entrar</button>
            <hr style="margin:15px 0; border:0; border-top:1px solid #eee;">
            <button class="btn-main btn-google" onclick="window.loginGoogle()">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18"> Google
            </button>
            <button class="btn-main btn-apple" style="margin-top:8px;" onclick="window.loginApple()">
                <img src="https://upload.wikimedia.org/wikipedia/commons/f/fa/Apple_logo_black.svg" width="16" style="filter: invert(1);"> Apple
            </button>
            <button class="btn-main btn-phone" style="margin-top:8px;" onclick="window.loginTelefone()">
                📱 Smartphone (SMS)
            </button>
        </div>
        <button style="border:none; background:none; margin-top:20px; color:#999; cursor:pointer;" onclick="window.fecharLogin()">Voltar ao Mapa</button>
    </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getFirestore, collection, addDoc, onSnapshot, doc, setDoc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
  import { getAuth, signInWithPopup, GoogleAuthProvider, OAuthProvider, RecaptchaVerifier, signInWithPhoneNumber, onAuthStateChanged, signOut, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDqc9r2B1IDMyRb0hPZBWD3F43GlKZPzRQ",
    authDomain: "alertavaga-56b46.firebaseapp.com",
    projectId: "alertavaga-56b46",
    storageBucket: "alertavaga-56b46.firebasestorage.app",
    messagingSenderId: "1006667244458",
    appId: "1:1006667244458:web:4c2f35f5520843452c01d3"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);
  const provider = new GoogleAuthProvider();

  let map, circle, allVagas = [], markers = [], papelS = null, userRole = 'visitante';
  let userPos = { lat: -19.919, lng: -43.938 };

  window.mostrarLogin = () => document.getElementById('login-modal').style.display='flex';
  window.fecharLogin = () => document.getElementById('login-modal').style.display='none';
  
  window.prepararPapel = (p) => {
      papelS = p;
      document.getElementById('auth-fields').style.opacity = '1';
      document.getElementById('auth-fields').style.pointerEvents = 'auto';
      document.getElementById('sel-c').style.background = p === 'candidato' ? '#0a66c2' : 'white';
      document.getElementById('sel-c').style.color = p === 'candidato' ? 'white' : '#0a66c2';
      document.getElementById('sel-e').style.background = p === 'empresa' ? '#0a66c2' : 'white';
      document.getElementById('sel-e').style.color = p === 'empresa' ? 'white' : '#0a66c2';
  };

  window.authEmail = async () => {
      const email = document.getElementById('auth-email').value;
      const pass = document.getElementById('auth-pass').value;
      try { await signInWithEmailAndPassword(auth, email, pass); }
      catch { await createUserWithEmailAndPassword(auth, email, pass); }
      window.fecharLogin();
  };

  window.loginGoogle = () => signInWithPopup(auth, provider).then(window.fecharLogin);
  window.loginApple = () => signInWithPopup(auth, new OAuthProvider('apple.com')).then(window.fecharLogin);
  
  window.loginTelefone = async () => {
      const tel = prompt("Número com +55 e DDD:");
      if(!tel) return;
      const recaptcha = new RecaptchaVerifier(auth, 'recaptcha-container', {size: 'invisible'});
      const confirmation = await signInWithPhoneNumber(auth, tel, recaptcha);
      const code = prompt("Código SMS:");
      await confirmation.confirm(code);
      window.fecharLogin();
  };

  window.salvarCargoPretendido = async () => {
      const cargo = document.getElementById('u-cargo-input').value;
      if (auth.currentUser) { await updateDoc(doc(db, "usuarios", auth.currentUser.uid), { cargoPretendido: cargo }); }
  };

  window.trocarPerfil = async () => {
      const nova = userRole === 'empresa' ? 'candidato' : 'empresa';
      await updateDoc(doc(db, "usuarios", auth.currentUser.uid), { tipo: nova });
      location.reload();
  };

  window.logout = () => signOut(auth).then(() => location.reload());

  onAuthStateChanged(auth, async (user) => {
    if (user) {
        document.getElementById('btn-entrar').style.display = 'none';
        document.getElementById('btn-sair').style.display = 'block';
        document.getElementById('user-info').classList.remove('hidden');
        const d = await getDoc(doc(db, "usuarios", user.uid));
        userRole = d.exists() ? d.data().tipo : papelS;
        if (!d.exists() && papelS) await setDoc(doc(db, "usuarios", user.uid), { tipo: papelS, cargoPretendido: "" });

        document.getElementById('u-name').innerText = user.displayName || user.email?.split('@')[0] || "Usuário";
        document.getElementById('u-photo').src = user.photoURL || "https://cdn-icons-png.flaticon.com/512/149/149071.png";
        document.getElementById('u-badge-container').innerHTML = `<span class="badge" style="background:${userRole === 'empresa' ? '#057642' : '#0a66c2'}">${userRole}</span>`;
        
        if (userRole === 'empresa') {
            document.getElementById('panel-empresa').classList.remove('hidden');
            document.getElementById('panel-candidato').classList.add('hidden');
            document.getElementById('area-cargo-candidato').classList.add('hidden');
        } else {
            document.getElementById('panel-empresa').classList.add('hidden');
            document.getElementById('panel-candidato').classList.remove('hidden');
            document.getElementById('area-cargo-candidato').classList.remove('hidden');
            if(d.exists()) document.getElementById('u-cargo-input').value = d.data().cargoPretendido || "";
        }
    }
    initMap();
  });

  function initMap() {
    if (map) return;
    // Captura localização real do celular se disponível
    if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(p => {
            userPos = { lat: p.coords.latitude, lng: p.coords.longitude };
            map.setCenter(userPos);
            circle.setCenter(userPos);
        });
    }

    map = new google.maps.Map(document.getElementById('map'), { 
        center: userPos, 
        zoom: 14, 
        disableDefaultUI: false, // Ativei os controles básicos para ajudar no mobile
        mapTypeControl: false,
        streetViewControl: false
    });

    circle = new google.maps.Circle({ map, center: userPos, radius: 5000, fillColor: "#0a66c2", fillOpacity: 0.1, strokeOpacity: 0, clickable: false });
    
    map.addListener('click', async (e) => {
        if (userRole !== 'empresa') return;
        const emp = document.getElementById('v-emp').value;
        const car = document.getElementById('v-cargo').value;
        if (!emp || !car) return alert("Preencha Empresa e Cargo!");
        await addDoc(collection(db, "vagas"), { emp, cargo: car, wa: document.getElementById('v-wa').value, lat: e.latLng.lat(), lng: e.latLng.lng() });
        alert("Vaga publicada!");
    });

    onSnapshot(collection(db, "vagas"), (snap) => {
        allVagas = []; snap.forEach(d => allVagas.push(d.data()));
        window.atualizar();
    });
  }

  window.atualizar = () => {
    const km = document.getElementById('range-km').value;
    document.getElementById('km-val').innerText = km;
    if(circle) circle.setRadius(km * 1000);
    render(allVagas.filter(v => google.maps.geometry.spherical.computeDistanceBetween(new google.maps.LatLng(userPos.lat, userPos.lng), new google.maps.LatLng(v.lat, v.lng)) <= (km * 1000)));
  };

  function render(vagas) {
    const list = document.getElementById('jobs-list');
    list.innerHTML = ""; markers.forEach(m => m.setMap(null));
    vagas.forEach(v => {
        const card = document.createElement('div');
        card.className = "profile-card";
        card.style.padding = "15px"; card.style.textAlign = "left";
        card.innerHTML = `<div style="font-weight:700; color:var(--primary);">${v.cargo}</div><div style="font-size:0.85rem; font-weight:600;">${v.emp}</div>
            <div style="display:flex; gap:10px; margin-top:10px;">
                ${v.wa ? `<button class="btn-sec" style="font-size:0.7rem; padding:5px 10px;" onclick="window.open('https://wa.me/${v.wa.replace(/\D/g,'')}')">WhatsApp</button>` : ''}
            </div>`;
        list.appendChild(card);
        markers.push(new google.maps.Marker({ position: {lat: v.lat, lng: v.lng}, map }));
    });
  }
</script>
</body>
</html>
