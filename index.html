<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alerta Vaga GPS</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4f46e5">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; font-family: sans-serif; }
        #map { height: 100vh; width: 100%; z-index: 1; }

        /* Interface Moderna por cima do mapa */
        .ui-overlay {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: white;
            padding: 15px 25px;
            border-radius: 50px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 280px;
        }

        .ui-overlay label { font-weight: bold; margin-bottom: 5px; color: #333; }
        #distancia-valor { color: #4f46e5; font-weight: bold; }
        input[type=range] { width: 100%; cursor: pointer; accent-color: #4f46e5; }
    </style>
</head>
<body>

    <div class="ui-overlay">
        <label>Raio de Busca: <span id="distancia-valor">5</span> km</label>
        <input type="range" id="range-raio" min="1" max="50" value="5" step="1">
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // 1. Inicialização do Mapa
        const map = L.map('map').setView([-19.9167, -43.9345], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);

        let raioCirculo;
        let marcadorUsuario;
        const slider = document.getElementById('range-raio');
        const displayValor = document.getElementById('distancia-valor');

        // 2. FUNÇÃO GPS (O que estava faltando do antigo)
        function localizarUsuario() {
            map.locate({setView: true, maxZoom: 15, watch: true});
        }

        map.on('locationfound', (e) => {
            const radius = slider.value * 1000;

            if (marcadorUsuario) {
                marcadorUsuario.setLatLng(e.latlng);
                raioCirculo.setLatLng(e.latlng);
                raioCirculo.setRadius(radius);
            } else {
                marcadorUsuario = L.marker(e.latlng).addTo(map).bindPopup("Você está aqui").openPopup();
                raioCirculo = L.circle(e.latlng, {
                    color: '#4f46e5',
                    fillColor: '#4f46e5',
                    fillOpacity: 0.15,
                    radius: radius
                }).addTo(map);
            }
        });

        // 3. ATUALIZAÇÃO DO RAIO VIA SLIDER
        slider.addEventListener('input', (e) => {
            const valor = e.target.value;
            displayValor.innerText = valor;
            if (raioCirculo) {
                raioCirculo.setRadius(valor * 1000);
                map.fitBounds(raioCirculo.getBounds());
            }
        });

        // Iniciar localização automática
        localizarUsuario();

        // 4. REGISTRO PWA (O que estava faltando do antigo)
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
