<div id="recaptcha-container"></div>

<style>
  /* Novos Estilos para Botões de Login Social */
  .btn-social-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 15px;
  }
  .btn-apple { background: #000; color: white; border: none; }
  .btn-phone { background: #25d366; color: white; border: none; } /* Cor estilo WhatsApp para fácil identificação */
  
  .modal-box hr { border: 0; border-top: 1px solid #eee; margin: 20px 0; position: relative; }
  .modal-box hr::after { content: "ou"; position: absolute; top: -10px; left: 50%; transform: translateX(-50%); background: white; padding: 0 10px; color: #999; font-size: 0.8rem; }
</style>

<div id="login-modal">
    <div class="modal-box">
        <h3 id="modal-title">Entrar no Alerta Vagas</h3>
        
        <div style="display:flex; gap:10px; margin-bottom:20px;">
            <button id="sel-c" class="btn-sec" style="margin:0" onclick="window.prepararPapel('candidato')">Sou Candidato</button>
            <button id="sel-e" class="btn-sec" style="margin:0" onclick="window.prepararPapel('empresa')">Sou Empresa</button>
        </div>

        <div id="auth-fields" style="opacity:0.5; pointer-events:none;">
            <div class="form-group">
                <label>E-MAIL</label>
                <input type="email" id="auth-email" placeholder="seu@email.com">
            </div>
            <div class="form-group">
                <label>SENHA</label>
                <input type="password" id="auth-pass" placeholder="******">
            </div>
            <button class="btn-main" onclick="window.authEmail()">Entrar com E-mail</button>

            <hr>

            <div class="btn-social-grid">
                <button class="btn-sec btn-google" onclick="window.loginGoogle()">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="16"> Google
                </button>
                
                <button class="btn-sec btn-apple" onclick="window.loginApple()">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/f/fa/Apple_logo_black.svg" width="16" style="filter: invert(1);"> Apple
                </button>
            </div>

            <button class="btn-main btn-phone" style="margin-top:10px;" onclick="window.loginTelefone()">
                📱 Entrar com Número de Celular
            </button>
        </div>

        <button style="background:none; border:none; margin-top:15px; color:#999; cursor:pointer;" onclick="window.fecharLogin()">Voltar ao Mapa</button>
    </div>
</div>

<script type="module">
  // Importações adicionais do Firebase
  import { 
      getAuth, 
      signInWithPopup, 
      GoogleAuthProvider, 
      OAuthProvider, 
      RecaptchaVerifier, 
      signInWithPhoneNumber 
  } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

  // ... (mantenha sua configuração e variáveis iniciais)

  const auth = getAuth(app);
  
  // 1. LÓGICA LOGIN APPLE
  window.loginApple = async () => {
      const appleProvider = new OAuthProvider('apple.com');
      try {
          await signInWithPopup(auth, appleProvider);
          window.fecharLogin();
      } catch (e) { alert("Erro Apple: " + e.message); }
  };

  // 2. LÓGICA LOGIN TELEFONE (SMARTPHONE)
  window.loginTelefone = async () => {
      const tel = prompt("Digite seu número com DDD (ex: +5511999999999):");
      if (!tel) return;

      // Configura o verificador visual/invisível
      window.recaptchaVerifier = new RecaptchaVerifier(auth, 'recaptcha-container', {
          'size': 'invisible'
      });

      try {
          const confirmationResult = await signInWithPhoneNumber(auth, tel, window.recaptchaVerifier);
          const codigo = prompt("Digite o código SMS de 6 dígitos enviado para seu celular:");
          await confirmationResult.confirm(codigo);
          window.fecharLogin();
      } catch (e) { 
          alert("Erro no Telefone: " + e.message);
          if (window.recaptchaVerifier) window.recaptchaVerifier.clear();
      }
  };

  // Mantenha as outras funções (loginGoogle, authEmail, etc)
</script>
