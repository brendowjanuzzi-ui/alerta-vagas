<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alerta Vagas Próximas de Você</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyB2frG9-iSSGQKeAsDUpyxUCSBdI0CCLp0&libraries=geometry"></script>

  <style>
    :root { --primary: #0a66c2; --bg: #f3f2ef; --border: #e0e0e0; }
    * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { margin: 0; background: var(--bg); color: #000; overflow: hidden; }

    /* HEADER ORIGINAL */
    header { 
        background: #fff; 
        padding: 0 24px; 
        display: flex; 
        justify-content: space-between; 
        align-items: center; 
        height: 65px; 
        border-bottom: 1px solid var(--border);
        z-index: 10;
        position: relative;
    }
    .logo-area { display: flex; align-items: center; gap: 10px; color: var(--primary); font-weight: 800; font-size: 1.1rem; }
    .pulse-dot { width: 10px; height: 10px; background: #ef4444; border-radius: 50%; animation: pulse 2s infinite; }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0px rgba(239, 68, 68, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0px rgba(239, 68, 68, 0); } }

    /* LAYOUT MAIN */
    #main { display: flex; height: calc(100vh - 65px); }
    #sidebar { width: 380px; background: var(--bg); padding: 15px; overflow-y: auto; border-right: 1px solid var(--border); }
    #map { flex: 1; }

    /* COMPONENTES */
    .card { background: #fff; border-radius: 10px; border: 1px solid var(--border); padding: 15px; margin-bottom: 15px; }
    .btn-blue { background: var(--primary); color: #fff; border: none; padding: 10px 20px; border-radius: 20px; font-weight: 700; cursor: pointer; }
    .btn-out { background: transparent; border: 1px solid var(--primary); color: var(--primary); padding: 8px 15px; border-radius: 20px; font-weight: 700; cursor: pointer; width: 100%; margin-top: 5px; }
    
    input { width: 100%; padding: 10px; margin-bottom: 8px; border: 1px solid var(--border); border-radius: 6px; outline: none; }
    .job-card { background: #fff; border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin-bottom: 10px; }

    /* MODAL LOGIN */
    #modal-login { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 1000; display: none; align-items: center; justify-content: center; }
    .modal-box { background: #fff; padding: 25px; border-radius: 15px; width: 340px; text-align: center; }
    
    .hidden { display: none !important; }
  </style>
</head>
<body>

<header>
    <div class="logo-area">
        <div class="pulse-dot"></div>
        Alerta Vagas Próximas de Você
    </div>
    <div id="auth-nav">
        <button id="btn-entrar" class="btn-blue" onclick="window.abrirModal()">Entrar</button>
        <button id="btn-sair" class="btn-out" style="display:none; width:auto" onclick="window.sair()">Sair</button>
    </div>
</header>

<div id="main">
    <div id="sidebar">
        <div id="perfil-card" class="card hidden">
            <div style="height:40px; background:var(--primary); margin:-15px -15px 10px -15px; border-radius:9px 9px 0 0;"></div>
            <div id="u-nome" style="font-weight:800; font-size:1rem;">Usuário</div>
            <div id="u-tipo" style="font-size:0.75rem; color:#666; margin-bottom:10px;">Candidato</div>
            <button class="btn-out" style="font-size:0.7rem;" onclick="window.mudarPapel()">Mudar para Empresa/Candidato</button>
        </div>

        <div class="card">
            <label style="font-size:0.8rem; font-weight:700;">Raio de busca: <span id="km-txt" style="color:var(--primary)">5</span> km</label>
            <input type="range" id="range-km" min="1" max="50" value="5" oninput="window.updateBusca()" style="margin-top:10px;">
        </div>

        <div id="post-vaga" class="card hidden" style="border-top: 4px solid #057642;">
            <h4 style="margin:0 0 10px 0;">Postar Nova Vaga 📍</h4>
            <input id="v-cargo" placeholder="Nome do Cargo">
            <input id="v-emp" placeholder="Nome da Empresa">
            <input id="v-wa" placeholder="WhatsApp ou E-mail">
            <p style="font-size:0.65rem; color:#057642; font-weight:700;">Clique no local da vaga no mapa</p>
        </div>

        <div id="lista-vagas"></div>
    </div>
    
    <div id="map"></div>
</div>

<div id="modal-login">
    <div class="modal-box">
        <h3 style="margin-top:0">Acesse sua Conta</h3>
        <p style="font-size:0.8rem; color:#666">Escolha seu perfil:</p>
        <div style="display:flex; gap:10px; margin-bottom:15px">
            <button id="btn-c" class="btn-out" onclick="window.setPapel('candidato')">Candidato</button>
            <button id="btn-e" class="btn-out" onclick="window.setPapel('empresa')">Empresa</button>
        </div>
        <div id="auth-forms" style="opacity:0.3; pointer-events:none">
            <input id="f-email" type="email" placeholder="E-mail">
            <input id="f-pass" type="password" placeholder="Senha">
            <button class="btn-blue" style="width:100%" onclick="window.loginEmail()">Entrar / Cadastrar</button>
            <div style="margin:15px 0; font-size:0.7rem; color:#aaa">OU</div>
            <button class="btn-out" onclick="window.loginGoogle()">Entrar com Google</button>
        </div>
        <button style="border:none; background:none; margin-top:15px; color:#999; cursor:pointer" onclick="window.fecharModal()">Voltar</button>
    </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getFirestore, collection, addDoc, onSnapshot, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
  import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDqc9r2B1IDMyRb0hPZBWD3F43GlKZPzRQ",
    authDomain: "alertavaga-56b46.firebaseapp.com",
    projectId: "alertavaga-56b46",
    storageBucket: "alertavaga-56b46.firebasestorage.app",
    messagingSenderId: "1006667244458",
    appId: "1:1006667244458:web:4c2f35f5520843452c01d3"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);
  const provider = new GoogleAuthProvider();

  let map, circle, todasVagas = [], markers = [], papelSel = null, userTipo = 'visitante';
  let minhaPos = { lat: -19.919, lng: -43.938 };

  // MODAL
  window.abrirModal = () => document.getElementById('modal-login').style.display='flex';
  window.fecharModal = () => document.getElementById('modal-login').style.display='none';
  window.setPapel = (p) => { 
      papelSel = p;
      document.getElementById('auth-forms').style.opacity = '1';
      document.getElementById('auth-forms').style.pointerEvents = 'auto';
      document.getElementById('btn-c').style.background = p === 'candidato' ? '#0a66c2' : 'transparent';
      document.getElementById('btn-c').style.color = p === 'candidato' ? '#fff' : '#0a66c2';
      document.getElementById('btn-e').style.background = p === 'empresa' ? '#0a66c2' : 'transparent';
      document.getElementById('btn-e').style.color = p === 'empresa' ? '#fff' : '#0a66c2';
  };

  // LOGIN
  window.loginGoogle = () => signInWithPopup(auth, provider).then(window.fecharModal);
  window.loginEmail = async () => {
      const email = document.getElementById('f-email').value;
      const pass = document.getElementById('f-pass').value;
      if(!email || pass.length < 6) return alert("E-mail e senha (min 6 chars) obrigatórios");
      try { await signInWithEmailAndPassword(auth, email, pass); }
      catch { await createUserWithEmailAndPassword(auth, email, pass); }
      window.fecharModal();
  };
  window.sair = () => signOut(auth).then(() => location.reload());

  // MONITORAR USUARIO
  onAuthStateChanged(auth, async (user) => {
      if (user) {
          document.getElementById('btn-entrar').style.display = 'none';
          document.getElementById('btn-sair').style.display = 'block';
          document.getElementById('perfil-card').classList.remove('hidden');
          
          const userDoc = await getDoc(doc(db, "usuarios", user.uid));
          userTipo = userDoc.exists() ? userDoc.data().tipo : papelSel;
          
          if(!userDoc.exists() && papelSel) await setDoc(doc(db, "usuarios", user.uid), { tipo: papelSel });
          
          document.getElementById('u-nome').innerText = user.displayName || user.email.split('@')[0];
          document.getElementById('u-tipo').innerText = userTipo === 'empresa' ? '🏢 Empresa' : '👤 Candidato';
          
          if(userTipo === 'empresa') document.getElementById('post-vaga').classList.remove('hidden');
      }
      initMap();
  });

  // MAPA E VAGAS
  function initMap() {
      if (map) return;
      map = new google.maps.Map(document.getElementById('map'), { center: minhaPos, zoom: 14, disableDefaultUI: true });
      circle = new google.maps.Circle({ map, center: minhaPos, radius: 5000, fillColor: "#0a66c2", fillOpacity: 0.1, strokeOpacity: 0, clickable: false });
      
      map.addListener('click', async (e) => {
          if (userTipo !== 'empresa') return;
          const cargo = document.getElementById('v-cargo').value;
          const empresa = document.getElementById('v-emp').value;
          if(!cargo || !empresa) return alert("Preencha cargo e empresa antes de marcar no mapa!");
          await addDoc(collection(db, "vagas"), { cargo, empresa, contato: document.getElementById('v-wa').value, lat: e.latLng.lat(), lng: e.latLng.lng(), created: Date.now() });
          alert("Vaga adicionada!");
      });

      onSnapshot(collection(db, "vagas"), (snap) => {
          todasVagas = []; snap.forEach(d => todasVagas.push(d.data()));
          window.updateBusca();
      });
  }

  window.updateBusca = () => {
      const km = document.getElementById('range-km').value;
      document.getElementById('km-txt').innerText = km;
      if(circle) circle.setRadius(km * 1000);
      const filtradas = todasVagas.filter(v => google.maps.geometry.spherical.computeDistanceBetween(new google.maps.LatLng(minhaPos.lat, minhaPos.lng), new google.maps.LatLng(v.lat, v.lng)) <= (km * 1000));
      renderVagas(filtradas);
  };

  function renderVagas(vagas) {
      const lista = document.getElementById('lista-vagas');
      lista.innerHTML = ""; markers.forEach(m => m.setMap(null));
      vagas.forEach(v => {
          const div = document.createElement('div');
          div.className = "job-card";
          div.innerHTML = `<div style="color:var(--primary); font-weight:800">${v.cargo}</div><div style="font-size:0.85rem; font-weight:600">${v.empresa}</div>
          <button class="btn-out" style="font-size:0.7rem; margin-top:8px" onclick="alert('Contato: ${v.contato}')">Candidatar-se / Ver Contato</button>`;
          lista.appendChild(div);
          markers.push(new google.maps.Marker({ position: {lat: v.lat, lng: v.lng}, map }));
      });
  }
</script>
</body>
</html>
