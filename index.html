<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Alerta Vagas Próximas de Você</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyB2frG9-iSSGQKeAsDUpyxUCSBdI0CCLp0&libraries=geometry"></script>

  <style>
    :root { --primary: #0a66c2; --bg: #f3f2ef; --border: #e0e0e0; --text: #000000; }
    * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { margin: 0; background: var(--bg); overflow: hidden; }

    /* HEADER */
    header { background: #fff; padding: 12px 24px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; height: 65px; }
    .logo-title { color: var(--primary); font-weight: 800; font-size: 1.1rem; display: flex; align-items: center; gap: 8px; }
    .pulse { width: 10px; height: 10px; background: #ef4444; border-radius: 50%; animation: pulse 2s infinite; }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0px rgba(239, 68, 68, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0px rgba(239, 68, 68, 0); } }

    #container { display: flex; height: calc(100vh - 65px); }
    #sidebar { width: 380px; background: var(--bg); padding: 15px; overflow-y: auto; border-right: 1px solid var(--border); }
    #map { flex: 1; background: #ddd; }

    /* CARDS */
    .card { background: white; border-radius: 10px; border: 1px solid var(--border); padding: 15px; margin-bottom: 15px; }
    .profile-header { height: 50px; background: var(--primary); margin: -15px -15px 10px -15px; border-radius: 9px 9px 0 0; }
    .job-card { background: white; border-radius: 8px; border: 1px solid var(--border); padding: 15px; margin-bottom: 10px; }
    
    .btn-main { background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 20px; font-weight: 700; cursor: pointer; width: 100%; }
    .btn-outline { background: transparent; border: 1px solid var(--primary); color: var(--primary); padding: 8px; border-radius: 20px; width: 100%; cursor: pointer; font-size: 0.8rem; margin-top: 5px; }

    /* MODAL */
    #modal { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 1000; display: none; align-items: center; justify-content: center; }
    .modal-content { background: white; padding: 25px; border-radius: 15px; width: 350px; text-align: center; }
    input { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid var(--border); border-radius: 6px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

<header>
    <div class="logo-title"><div class="pulse"></div> Alerta Vagas Próximas de Você</div>
    <button id="btn-login-trigger" class="btn-main" style="width:auto" onclick="window.abrirModal()">Entrar</button>
    <button id="btn-logout" class="btn-outline" style="display:none; width:auto" onclick="window.sair()">Sair</button>
</header>

<div id="container">
    <div id="sidebar">
        <div id="user-card" class="card hidden">
            <div class="profile-header"></div>
            <div id="user-name" style="font-weight:700">Usuário</div>
            <div id="user-role" style="font-size:0.75rem; color:#666; margin-bottom:10px;">Candidato</div>
            <button class="btn-outline" onclick="window.trocar()">Mudar para Empresa</button>
        </div>

        <div id="search-box" class="card">
            <label style="font-size:0.8rem; font-weight:700">Ver vagas em <span id="val">5</span> km</label>
            <input type="range" id="range" min="1" max="50" value="5" oninput="window.atualizar()">
        </div>

        <div id="post-box" class="card hidden" style="border-top: 4px solid var(--primary)">
            <h4 style="margin:0 0 10px 0">Nova Vaga</h4>
            <input id="v-cargo" placeholder="Cargo">
            <input id="v-emp" placeholder="Empresa">
            <input id="v-contato" placeholder="WhatsApp ou E-mail">
            <p style="font-size:0.6rem; color:var(--primary)">Toque no mapa para marcar o local</p>
        </div>

        <div id="list"></div>
    </div>
    <div id="map"></div>
</div>

<div id="modal">
    <div class="modal-content">
        <h3>Acesse sua Conta</h3>
        <div style="display:flex; gap:10px; margin-bottom:15px">
            <button id="sc" class="btn-outline" onclick="window.setRole('candidato')">Candidato</button>
            <button id="se" class="btn-outline" onclick="window.setRole('empresa')">Empresa</button>
        </div>
        <div id="fields" style="opacity:0.3; pointer-events:none">
            <input id="e" placeholder="E-mail">
            <input id="p" type="password" placeholder="Senha">
            <button class="btn-main" onclick="window.auth()">Entrar / Cadastrar</button>
            <hr style="margin:15px 0; border:0; border-top:1px solid #eee">
            <button class="btn-outline" onclick="window.google()">Logar com Google</button>
        </div>
        <button style="border:none; background:none; margin-top:15px; color:#999; cursor:pointer" onclick="window.fecharModal()">Voltar</button>
    </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getFirestore, collection, addDoc, onSnapshot, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
  import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDqc9r2B1IDMyRb0hPZBWD3F43GlKZPzRQ",
    authDomain: "alertavaga-56b46.firebaseapp.com",
    projectId: "alertavaga-56b46",
    storageBucket: "alertavaga-56b46.firebasestorage.app",
    messagingSenderId: "1006667244458",
    appId: "1:1006667244458:web:4c2f35f5520843452c01d3"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);
  const provider = new GoogleAuthProvider();

  let map, circle, all = [], markers = [], papel = null, role = 'visitante';
  let pos = { lat: -19.919, lng: -43.938 };

  window.abrirModal = () => document.getElementById('modal').style.display='flex';
  window.fecharModal = () => document.getElementById('modal').style.display='none';
  window.setRole = (r) => { 
      papel = r; 
      document.getElementById('fields').style.opacity = '1';
      document.getElementById('fields').style.pointerEvents = 'auto';
  };

  window.google = () => signInWithPopup(auth, provider).then(window.fecharModal);
  window.auth = async () => {
      const email = document.getElementById('e').value;
      const pass = document.getElementById('p').value;
      try { await signInWithEmailAndPassword(auth, email, pass); }
      catch { await createUserWithEmailAndPassword(auth, email, pass); }
      window.fecharModal();
  };
  window.sair = () => signOut(auth).then(() => location.reload());

  onAuthStateChanged(auth, async (u) => {
      if (u) {
          document.getElementById('btn-login-trigger').style.display = 'none';
          document.getElementById('btn-logout').style.display = 'block';
          document.getElementById('user-card').classList.remove('hidden');
          const d = await getDoc(doc(db, "usuarios", u.uid));
          role = d.exists() ? d.data().tipo : papel;
          if(!d.exists() && papel) await setDoc(doc(db, "usuarios", u.uid), { tipo: papel });
          document.getElementById('user-name').innerText = u.displayName || u.email;
          document.getElementById('user-role').innerText = role === 'empresa' ? '🏢 Empresa' : '👤 Candidato';
          if(role === 'empresa') document.getElementById('post-box').classList.remove('hidden');
      }
      initMap();
  });

  function initMap() {
      if (map) return;
      map = new google.maps.Map(document.getElementById('map'), { center: pos, zoom: 14, disableDefaultUI: true });
      circle = new google.maps.Circle({ map, center: pos, radius: 5000, fillColor: "#0a66c2", fillOpacity: 0.1, strokeOpacity: 0, clickable: false });
      
      map.addListener('click', async (e) => {
          if (role !== 'empresa') return;
          const cargo = document.getElementById('v-cargo').value;
          const emp = document.getElementById('v-emp').value;
          if(!cargo || !emp) return alert("Preencha os dados da vaga!");
          await addDoc(collection(db, "vagas"), { cargo, emp, contato: document.getElementById('v-contato').value, lat: e.latLng.lat(), lng: e.latLng.lng() });
      });

      onSnapshot(collection(db, "vagas"), (snap) => {
          all = []; snap.forEach(doc => all.push(doc.data()));
          window.atualizar();
      });
  }

  window.atualizar = () => {
      const km = document.getElementById('range').value;
      document.getElementById('val').innerText = km;
      if(circle) circle.setRadius(km * 1000);
      const filtered = all.filter(v => google.maps.geometry.spherical.computeDistanceBetween(new google.maps.LatLng(pos.lat, pos.lng), new google.maps.LatLng(v.lat, v.lng)) <= (km * 1000));
      render(filtered);
  };

  function render(vagas) {
      const list = document.getElementById('list');
      list.innerHTML = ""; markers.forEach(m => m.setMap(null));
      vagas.forEach(v => {
          const div = document.createElement('div');
          div.className = "job-card";
          div.innerHTML = `<div style="color:var(--primary); font-weight:700">${v.cargo}</div><div>${v.emp}</div>
          <button class="btn-outline" onclick="alert('Contato: ${v.contato}')">Ver Contato</button>`;
          list.appendChild(div);
          markers.push(new google.maps.Marker({ position: {lat: v.lat, lng: v.lng}, map }));
      });
  }
</script>
</body>
</html>
