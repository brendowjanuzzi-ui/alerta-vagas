<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Plataforma inteligente de busca de empregos por geolocalização. Encontre vagas próximas de você em tempo real." />
  <meta name="theme-color" content="#0a66c2" />

  <title>Alerta Vagas — Vagas próximas de você</title>

  <link rel="icon" type="image/png" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="manifest" href="manifest.json" />

  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5n/N0ZDvEg=" crossorigin="" />

  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header class="app-header">
    <div class="logo-title">
      <span class="pulse-icon" aria-hidden="true"></span>
      <span>Alerta Vagas</span>
    </div>
    <div class="header-actions">
      <button id="btn-localizar" class="icon-btn" title="Usar minha localização" aria-label="Usar minha localização">📍</button>
      <button id="btn-entrar" class="btn-main btn-sm" onclick="window.mostrarLogin()">Entrar</button>
      <button id="btn-sair" class="btn-sec btn-sm hidden" onclick="window.logout()">Sair</button>
    </div>
  </header>

  <div id="map" role="application" aria-label="Mapa de vagas"></div>

  <!-- Alerta / mensagens do sistema -->
  <div id="alert-banner" class="alert-banner hidden" role="status"></div>

  <aside id="sidebar" aria-label="Painel de vagas">
    <button class="drag-handle-container" id="sidebar-toggle" aria-label="Abrir/fechar painel">
      <span class="drag-handle"></span>
    </button>

    <div class="sidebar-content">

      <!-- Informações do usuário logado -->
      <div id="user-info" class="hidden">
        <div class="user-head">
          <h3 id="u-name">Olá!</h3>
          <span id="u-badge" class="badge"></span>
        </div>

        <div id="area-cargo-candidato" class="hidden">
          <label for="u-cargo-input">O que você procura?</label>
          <input type="text" id="u-cargo-input" placeholder="Ex: Motorista, Vendedor, Auxiliar..." />
        </div>

        <button class="btn-link" onclick="window.trocarPerfil()">↔ Mudar tipo de conta</button>
        <hr class="divider" />
      </div>

      <!-- Painel do candidato: filtros -->
      <section id="panel-candidato">
        <label for="search-input" class="field-label">🔎 Buscar vaga ou empresa</label>
        <input type="text" id="search-input" placeholder="Ex: Motorista, Vendedor..." />

        <div class="chips" id="tipo-chips" role="tablist" aria-label="Filtrar por tipo de contratação"></div>

        <label for="range-km" class="field-label">
          Distância máxima: <strong id="km-val">5</strong> km
        </label>
        <input type="range" id="range-km" min="1" max="50" value="5" />

        <div class="filter-row">
          <label for="sort-select" class="field-label">Ordenar por</label>
          <select id="sort-select">
            <option value="dist">Mais próximas</option>
            <option value="recente">Mais recentes</option>
            <option value="salario">Maior salário</option>
          </select>
        </div>

        <div class="results-count">
          <span id="results-text">Carregando vagas...</span>
        </div>
      </section>

      <!-- Painel da empresa: anunciar vaga -->
      <section id="panel-empresa" class="hidden">
        <div class="profile-card card-empresa">
          <h4>📢 Anunciar Vaga</h4>
          <input type="text" id="v-emp" placeholder="Nome da Empresa *" />
          <input type="text" id="v-cargo" placeholder="Cargo *" />
          <input type="text" id="v-salario" placeholder="Salário (ex: R$ 2.500)" />
          <select id="v-tipo">
            <option value="">Tipo de contratação</option>
            <option value="CLT">CLT</option>
            <option value="PJ">PJ</option>
            <option value="Estágio">Estágio</option>
            <option value="Aprendiz">Aprendiz</option>
            <option value="Freelancer">Freelancer</option>
            <option value="Temporário">Temporário</option>
          </select>
          <input type="text" id="v-contato" placeholder="WhatsApp p/ contato (ex: 5531999999999)" />
          <textarea id="v-descricao" placeholder="Descrição da vaga, horário, requisitos..." rows="3"></textarea>
          <p class="hint">📍 Após preencher, toque no local exato da vaga no mapa.</p>
          <button class="btn-sec" onclick="window.limparFormVaga()">Limpar</button>
        </div>
      </section>

      <!-- Lista de vagas -->
      <div id="jobs-list">
        <p class="placeholder">Carregando vagas ao seu redor...</p>
      </div>
    </div>
  </aside>

  <!-- Modal de login -->
  <div id="login-modal" class="modal" role="dialog" aria-modal="true" aria-label="Acessar conta">
    <div class="modal-box">
      <button class="modal-close" onclick="window.fecharLogin()" aria-label="Voltar ao mapa">✕</button>
      <h3>Acessar Alerta Vagas</h3>
      <p class="muted">Escolha seu perfil para continuar:</p>

      <div class="role-pick">
        <button id="sel-c" class="role-btn" onclick="window.prepararPapel('candidato')">
          <span class="role-emoji">🧑</span> Candidato
        </button>
        <button id="sel-e" class="role-btn" onclick="window.prepararPapel('empresa')">
          <span class="role-emoji">🏢</span> Empresa
        </button>
      </div>

      <div id="auth-fields" class="auth-fields disabled">
        <input type="email" id="auth-email" placeholder="Seu e-mail" autocomplete="email" />
        <input type="password" id="auth-pass" placeholder="Sua senha" autocomplete="current-password" />
        <button class="btn-main" onclick="window.authEmail()">Entrar / Criar conta</button>

        <div class="divider-text"><span>ou continue com</span></div>

        <div class="social-btns">
          <button class="btn-social" onclick="window.loginGoogle()">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20" alt=""> Google
          </button>
          <button class="btn-social btn-apple" onclick="window.loginApple()">
            <img src="https://upload.wikimedia.org/wikipedia/commons/f/fa/Apple_logo_black.svg" width="18" alt=""> Apple ID
          </button>
          <button class="btn-social btn-phone" onclick="window.loginTelefone()">
            📱 Telefone (SMS)
          </button>
        </div>
      </div>

      <!-- Fluxo de login por telefone -->
      <div id="phone-flow" class="phone-flow hidden">
        <div id="recaptcha-container"></div>
        <input type="tel" id="phone-number" placeholder="+55 31 99999-9999" />
        <button class="btn-main" id="btn-send-code" onclick="window.enviarCodigoTelefone()">Enviar código SMS</button>

        <div id="code-step" class="hidden">
          <input type="text" id="phone-code" placeholder="Código de 6 dígitos" inputmode="numeric" maxlength="6" />
          <button class="btn-main" onclick="window.confirmarCodigoTelefone()">Confirmar código</button>
        </div>
        <button class="btn-link" onclick="window.voltarParaLogin()">← Voltar</button>
      </div>
    </div>
  </div>

  <!-- Modal de detalhes da vaga -->
  <div id="job-modal" class="modal" role="dialog" aria-modal="true" aria-label="Detalhes da vaga">
    <div class="modal-box" id="job-modal-content">
      <button class="modal-close" onclick="window.fecharDetalhe()" aria-label="Fechar">✕</button>
      <div id="job-detail"></div>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <script type="module" src="app.js"></script>
</body>
</html>
